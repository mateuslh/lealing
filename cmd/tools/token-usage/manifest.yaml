apiVersion: lealing.dev/v1
id: token-usage
version: 1.0.0
name: Uso de Tokens
summary: Consumo de tokens e custo estimado, somando todas as sessões, por modelo, dia e projeto.
detail: Varre os logs do Claude Code e do Codex, normaliza o consumo relatado por cada CLI, consulta cotas quando há credenciais e estima o custo pela tabela de preços.
category: ai
risk: safe
glyph: ◔
keywords:
  - claude
  - codex
  - custo
  - tokens
  - gasto
  - usage
  - preço
runtime:
  kind: process
  protocol:
    min: 1
    max: 1
  executable: lealing-tool-token-usage
ui:
  mode: screen-v1
platforms:
  - darwin-arm64
  - darwin-amd64
  - windows-amd64
  - windows-arm64
requirements: []
permissions:
  filesystem:
    read:
      - ~/.claude/projects
      - ~/.claude/.credentials.json
      - ~/.codex/sessions
      - ~/.codex/auth.json
    write: []
  network: true
  subprocess: true
