# Constrói as tools oficiais como processos independentes. Enquanto elas
# vivem neste monorepo, a publicação é um artefato versionado do workflow; ao
# extrair lealing-tools, o último job pode ser ligado à release daquele repo.
name: official-tools

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão SemVer da token-usage"
        required: true
        default: "1.0.0"
        type: string
  push:
    branches: [main]
    paths:
      - "cmd/tools/**"
      - "sdk/**"
      - "internal/adapter/outbound/pluginprocess/**"
      - ".github/workflows/tools.yml"
  pull_request:
    paths:
      - "cmd/tools/**"
      - "sdk/**"
      - "internal/adapter/outbound/pluginprocess/**"
      - ".github/workflows/tools.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: fmt
        run: test -z "$(gofmt -l -s cmd/tools sdk)"
      - name: vet
        run: go vet ./cmd/tools/... ./sdk/...
      - name: test
        run: go test ./cmd/tools/... ./sdk/...
      - name: race dos pacotes concorrentes
        run: go test -race ./sdk/screen ./internal/adapter/outbound/pluginprocess ./cmd/tools/token-usage/...
      - name: valida manifest
        run: go run ./cmd/lealing -tool-validate cmd/tools/token-usage/manifest.yaml
      - name: conformidade screen-v1
        run: go test ./sdk/protocol ./sdk/screen ./internal/adapter/outbound/pluginprocess

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            format: tar
          - goos: darwin
            goarch: arm64
            format: tar
          - goos: windows
            goarch: amd64
            format: zip
          - goos: windows
            goarch: arm64
            format: zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: compila e empacota
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TOOL_VERSION: ${{ inputs.version || '1.0.0' }}
          PACKAGE_FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          if [[ ! "$TOOL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "versão inválida: $TOOL_VERSION" >&2
            exit 1
          fi
          target="token-usage_${GOOS}_${GOARCH}"
          stage="dist/${target}"
          mkdir -p "$stage"
          suffix=""
          if [[ "$GOOS" == windows ]]; then suffix=".exe"; fi
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=${TOOL_VERSION}" \
            -o "$stage/lealing-tool-token-usage${suffix}" ./cmd/tools/token-usage
          sed "s/^version: .*/version: ${TOOL_VERSION}/" \
            cmd/tools/token-usage/manifest.yaml > "$stage/manifest.yaml"
          if [[ "$PACKAGE_FORMAT" == zip ]]; then
            (cd "$stage" && zip -q "../${target}.zip" ./*)
          else
            tar -C "$stage" -czf "dist/${target}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: token-usage-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/token-usage_${{ matrix.goos }}_${{ matrix.goarch }}.*
          if-no-files-found: error

  publish-artifacts:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: token-usage-*
          path: dist
          merge-multiple: true
      - name: gera checksums
        run: (cd dist && sha256sum token-usage_* > checksums.txt)
      - name: inclui o manifest publicado
        env:
          TOOL_VERSION: ${{ inputs.version || '1.0.0' }}
        run: |
          mkdir -p dist/metadata
          sed "s/^version: .*/version: ${TOOL_VERSION}/" \
            cmd/tools/token-usage/manifest.yaml > dist/metadata/manifest.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: official-tools-${{ inputs.version || 'snapshot' }}
          path: dist
          if-no-files-found: error
          retention-days: 30
