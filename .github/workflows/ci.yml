# Suíte a cada push e pull request.
#
# Roda nos três sistemas de propósito: os adapters de macOS e de Windows
# compilam em qualquer lugar (é a regra do AGENTS.md), e é essa matriz que
# garante que continuem compilando.
name: ci

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l -s .)
          if [ -n "$unformatted" ]; then
            echo "arquivos fora do gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      # Além de validar a sintaxe, instala a última release em um diretório
      # temporário. Isso exercita arquitetura, download, checksum e extração
      # no PowerShell real do runner Windows.
      - name: instalador PowerShell
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          LEALING_BIN_DIR: ${{ runner.temp }}/lealing-install-test
          LEALING_NO_PATH: "1"
        run: |
          & ./scripts/install.ps1
          & "$env:LEALING_BIN_DIR/lealing.exe" -version

      # O detector de corrida só num sistema: ele triplica o tempo da suíte, e
      # uma corrida de goroutine não é específica de plataforma.
      - name: race
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...
